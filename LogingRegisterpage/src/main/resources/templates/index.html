<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome to Our App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>My Awesome Spring App</h1>
    </header>

    <main>
        <h2>Welcome!</h2>
        <p>This is a simple Spring Boot application with Thymeleaf.</p>

        <div th:if="${user == null}">
            <p>Please join us to explore more features.</p>
            <a th:href="@{/login}"><button>Login</button></a>
            <a th:href="@{/register}"><button>Register</button></a>
        </div>

        <div th:if="${user != null}">
            <p>Hello, <span th:text="${user.username}">Guest</span>! Glad to see you back.</p>
            <a th:href="@{/profile}">Go to My Profile</a>
        </div>
    </main>
</body>
</html>
