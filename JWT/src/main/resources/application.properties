spring.application.name=JWT

# Server
server.port=8080

# MySQL Config
spring.datasource.url=jdbc:mysql://localhost:3306/jwt_demo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1522
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# JWT Config
jwt.access.secret=yourSuperSecretKeyThatShouldBeLongEnough123456
jwt.refresh.secret=yourSuperSecretKeyThatShouldBeLongEnough123456
# Access token: 15 minutes
jwt.access.ttl-ms=900000
# Refresh token: 7 days
jwt.refresh.ttl-ms=604800000
