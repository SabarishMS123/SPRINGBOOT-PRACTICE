<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>index Page</title>
</head>

<body th:replace="~{Base :: layout(~{::section})}">
	
	
	
	<section>
		
		<div class="container-fluid m-3 p-5">
		  <div class="row g-3">

		    <!-- Category Add Form -->
			<form  action="/Admin/saveCategory" method="post" 
				enctype="multipart/form-data">
		    <div class="col-md-4 ">
		      <div class="card shadow h-100">
		        <div class="card-header text-center">
		          <p class="fs-4">Category Add</p >
				  <th:block th:if="${session.succMsg}">
					<p class="text-center fw-bold">[[${session.succMsg}]]</p>
					<th:block th:text="${@commnServiceimpl.removeSessionMessage()}"></th:block>
				  </th:block>
				  
				  <th:block th:if="${session.errorMsg}">
				  	<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
					<th:block th:text="${@commnServiceimpl.removeSessionMessage()}"></th:block>
				  </th:block>
		        </div>

		        <div class="card-body">

		          <div class="mb-3">
		            <label>Title</label>
		            <input type="text" name="name" class="form-control">
		          </div>
				  
				  <div class="mb-3">
				  	<label>Ststus</label>
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="isActive" 
					  id="radioDefault1" checked value="true">
					  <label class="form-check-label" for="radioDefault1">
					    Active
					  </label>
					</div>
					
					<div class="form-check">
					  <input class="form-check-input" type="radio" name="isActive" value="false
					  id="radioDefault2 >
					  <label class="form-check-label" for="radioDefault2">
					    InActive
					  </label>
					</div>
				  </div>

		          <div class="mb-3">
		            <label>Image</label>
		            <input type="file" name="file" class="form-control">
		          </div>

		          <button class="btn btn-primary w-100">Add</button>

		        </div>
		      </div>
		    </div>
			</form>

		    <!-- Category Details Table -->
		    <div class="col-md-8">
		      <div class="card shadow h-100">
		        <div class="card-header text-center">
		          <h5>Category Details</h5>
		        </div>

		        <div class="card-body">

		          <table class="table table-bordered text-center align-middle">
		            <thead class="table-light">
		              <tr>
		                <th>Category Name</th>
		                <th>Image</th>
		                <th>Action</th>
		              </tr>
		            </thead>
		            <tbody>
		              <tr th:each="cat, c:${Categorys}" >
		                <td ><!--Electronics--> [[${c.count}]]</td>
						<td>[[${cat.name}]]</td>
						<td>[[${cat.isActive}]]</td>
		                <td><img src="@{'/Img/category_img/'+${cat.imageName}}" width="40px" 
							height="40px "></td>
		                <td>
		                  <a th:href="@{'/Admin/loadEditCategory'+${cat.id}}"
						  class="btn btn-sm btn-primary">
						  <i class="fa-regular fa-pen-to-square"></i>Edit</a>
						  
		                  <a th:href="@{'/Admin/delectCategory'+${cat.id}}" 
						  class="btn btn-sm btn-danger">
						  <i class="fa-solid fa-trash-arrow-up"></i>Delete</a>
		                </td>
		              </tr>

		              <!--<tr>
		                <td>Laptop</td>
		                <td><img src="Img/category/laptop.png" width="40"></td>
		                <td>
		                  <button class="btn btn-sm btn-primary">Edit</button>
		                  <button class="btn btn-sm btn-danger">Delete</button>
		                </td>
		              </tr>

		              <tr>
		                <td>Mobile Phone</td>
		                <td><img src="Img/category/mobile.png" width="40"></td>
		                <td>
		                  <button class="btn btn-sm btn-primary">Edit</button>
		                  <button class="btn btn-sm btn-danger">Delete</button>
		                </td>
		              </tr>

		              <tr>
		                <td>Cloth</td>
		                <td><img src="Img/category/cloth.png" width="40"></td>
		                <td>
		                  <button class="btn btn-sm btn-primary">Edit</button>
		                  <button class="btn btn-sm btn-danger">Delete</button>
		                </td>
		              </tr>

		              <tr>
		                <td>Fashion</td>
		                <td><img src="Img/category/fashion.png" width="40"></td>
		                <td>
		                  <button class="btn btn-sm btn-primary">Edit</button>
		                  <button class="btn btn-sm btn-danger">Delete</button>
		                </td>
		              </tr>-->

		            </tbody>
		          </table>

		        </div>
		      </div>
		    </div>

		  </div>
		</div>
		
		<!-- Here you want to add new just add create a div element and 
		give some inline properties like Example : p-3 (padding 3px all the sides)
		-->
		
	</section>
</body>
</html>
