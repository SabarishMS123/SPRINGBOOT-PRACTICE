<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Success</title>
</head>

<body th:replace="~{Base :: layout(~{::section})}">

<section>

<div class="flex items-center justify-center min-h-screen bg-gray-100">

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-lg w-full max-w-md overflow-hidden text-center">

        <!-- Header -->
        <div class="bg-green-500 text-white py-5">
            <div class="text-6xl">✔</div>
            <h2 class="mt-2 text-xl tracking-widest">SUCCESS</h2>
        </div>

        <!-- Body -->
        <div class="p-5">

            <!-- Dynamic Success Message (Optional) -->
            <div th:if="${session.succMsg}" class="alert alert-success">
                <span th:text="${session.succMsg}"></span>
            </div>

            <!-- Logo -->
            <div class="flex justify-center mb-3">
                <div class="flex space-x-2">
                    <div class="bg-green-500 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">P</div>
                    <div class="bg-green-400 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">O</div>
                    <div class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">J</div>
                    <div class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">E</div>
                    <div class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">-</div>
                    <div class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">C</div>
                    <div class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">O</div>
                    <div class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold">M</div>
                </div>
            </div>

            <!-- Text -->
            <h3 class="text-2xl font-semibold text-green-600 mb-3">
                Product <span class="font-bold">Added Successfully!</span>
            </h3>

            <p class="text-gray-600 text-sm mb-3">
                Your product has been successfully saved in the system.
            </p>

            <p class="text-gray-400 text-xs">
                You can continue adding more products or go back to dashboard.
            </p>

            <!-- Button -->
            <div class="mt-5">
                <a th:href="@{/}" 
                   class="bg-green-500 text-white px-5 py-2 rounded-full hover:bg-green-600 text-decoration-none">
                    Go Home
                </a>
            </div>

        </div>

    </div>

</div>

</section>

</body>
</html>
