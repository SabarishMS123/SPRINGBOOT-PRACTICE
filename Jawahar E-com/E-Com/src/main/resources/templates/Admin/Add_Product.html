<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>index Page</title>
</head>

<body th:replace="~{Base :: layout(~{::section})}">
	<section>
		
		<div class="container p-5 mt-3">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Add Product</div>
						<div class="card-body">
							<form th:action="@{/Admin/saveProduct}" method="post" enctype="multipart/form-data"> 
								<div class="mb-3">
									<label>Enter Title</label>
									<input type="text" name="title" 
									class="form-control">
								</div>
								<div class="mb-3">
		          					<label>Enter Description</label>
									<textarea rows="3" cols="" 
									class="form-control"></textarea>
								</div>
								<div class="mb-3">
								  <label class="form-label">Enter Category</label>
								  <select class="form-control">
								    <option>--select--</option>
								    <option>Mobile</option>
								    <option>Laptop</option>
								    <option>Electronics</option>
								    <option>Clothes</option>
								  </select>
								</div>

								<div class="mb-3">
								  <label class="form-label">Enter Price</label>
								  <input type="number" class="form-control" placeholder="Enter Price">
								</div>

								<div class="row">

								  <div class="col-md-6 mb-3">
								    <label class="form-label">Stock</label>
								    <input type="number" class="form-control" min=0 max=1000 placeholder="Enter Stock">
								  </div>

								  <div class="col-md-6 mb-3">
								    <label class="form-label">Image</label>
								    <input type="file" class="form-control">
								  </div>

								</div>

								<div class="d-grid">
								    <a th:href="@{/savedata}">
								        <button class="btn btn-primary">Submit</button>
								    </a>
								</div>
								
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<!-- Here you want to add new just add create a div element and 
		give some inline properties like Example : p-3 (padding 3px all the sides)
		-->
		
	</section>
</body>
</html>
